        if (document.getElementById("compareOverlay").classList.contains("show")) {
          e.preventDefault();
          closeCompare();
          return;
        }
        if (!document.getElementById("moreMenu").hidden) {
          e.preventDefault();
          closeMore();
          return;
        }
        if (document.getElementById("editOverlay").classList.contains("show")) {
          e.preventDefault();
          closeEdit();
          return;
        }
        if (document.getElementById("confirmOverlay").classList.contains("show")) {
          e.preventDefault();
          closeConfirm();
          return;
        }
        if (e.target && e.target.id === "quickAdd") return;
        if (e.target && e.target.id === "q") {
          e.preventDefault();
          e.target.value = "";
          clearTimeout(searchTimer);
          state.query = "";
          renderBoard();
        }
        return;
      }
      if (e.key.toLowerCase() !== "z" || e.altKey || e.shiftKey || !(e.metaKey || e.ctrlKey)) return;
      const el = e.target;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !el.readOnly && !el.disabled) return;
      if ((!undoBatch || !undoBatch.length) && !undoSnapshot && !(undoAddedIds && undoAddedIds.length)) return;
      e.preventDefault();
      undoRemoval();
    });
    document.getElementById("confirmCancel").onclick = closeConfirm;
    document.getElementById("confirmAlt").onclick = () => {
      const action = confirmAltAction;
      closeConfirm();
      if (action) action();
    };
    document.getElementById("confirmOk").onclick = () => {
      const action = confirmAction;
      closeConfirm();
      if (action) action();
    };
    document.getElementById("confirmOverlay").addEventListener("click", (ev) => {
      if (ev.target.id === "confirmOverlay") closeConfirm();
    });

    function closeMore() {
      const menu = document.getElementById("moreMenu");
      const btn = document.getElementById("moreBtn");
      if (menu) menu.hidden = true;
      if (btn) btn.setAttribute("aria-expanded", "false");
    }

    function closeCompare() {
      document.getElementById("compareOverlay").classList.remove("show");
    }

    function openCompare(name, type) {
      const items = filtered().filter((item) => item.name === name && item.type === type);
      if (items.length < 2) return toast("当前筛选下不足两套，无法对比");
      const narrowed = state.query.trim() || state.priceBand !== "all" || state.favOnly;
      document.getElementById("compareTitle").textContent = `${name} · ${TYPE_NAME[type] || ""}`;
      document.getElementById("compareNote").textContent = narrowed ? "仅对比当前筛选结果" : "同一分组里的方案";
      const body = document.getElementById("compareBody");
      const draw = (list) => {
        body.innerHTML = `<div class="compare-row">${list.map((item) => `
          <article class="compare-card">
            <p><strong>${escapeHtml(item.note || "未命名方案")}</strong></p>
            <p>${escapeHtml(item.price || "未标价")}</p>
            <p>${escapeHtml(item.code || "（空）")}</p>
            <button type="button" data-compare-copy="${escapeHtml(item.id)}">复制这套</button>
          </article>`).join("")}</div>`;
      };
      if (items.length <= 4) draw(items);
      else {
        body.innerHTML = `<div class="compare-pick">${items.map((item) => `
          <label><input type="checkbox" value="${escapeHtml(item.id)}" /> ${escapeHtml(item.note || "未命名方案")} · ${escapeHtml(item.price || "未标价")}</label>
        `).join("")}<button type="button" id="compareGo">对比所选（2–4 套）</button></div>`;
        body.querySelector("#compareGo").onclick = () => {
          const ids = [...body.querySelectorAll("input:checked")].map((input) => input.value);
          if (ids.length < 2 || ids.length > 4) return toast("请勾选 2 到 4 套");
          draw(items.filter((item) => ids.includes(item.id)));
        };
      }
      document.getElementById("compareOverlay").classList.add("show");
    }

    document.getElementById("compareBody").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-compare-copy]");
      if (!btn) return;
      const item = state.items.find((x) => x.id === btn.dataset.compareCopy);
      if (!item || !item.code) return toast("这套没有改枪码");
      const ok = await copyText(item.code);
      toast(ok ? "已复制这套改枪码" : "复制失败，请检查剪贴板权限");
    });
    document.getElementById("compareClose").onclick = closeCompare;
    document.getElementById("compareOverlay").addEventListener("click", (ev) => {
      if (ev.target.id === "compareOverlay") closeCompare();
    });

    document.getElementById("moreBtn").onclick = () => {
      const menu = document.getElementById("moreMenu");
      const open = menu.hidden;
      menu.hidden = !open;
      document.getElementById("moreBtn").setAttribute("aria-expanded", open ? "true" : "false");
    };
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".more")) closeMore();
    });
    document.getElementById("copyAllBtn").onclick = async () => {
      closeMore();
      const ok = await copyText(JSON.stringify(backupPayload(), null, 2));
      if (!ok) {
        exportBackup();
        toast("复制失败，已改为下载备份");
        return;
      }
      markBackedUp();
      toast("已复制全部数据");
    };
    document.getElementById("restoreBtn").onclick = () => {
      closeMore();
      importMode = "restore";
      document.getElementById("importFile").click();
    };
    document.getElementById("shareViewBtn").onclick = () => {
      closeMore();
      shareEncoded(filtered(), "已复制当前结果的分享码");
    };
    document.getElementById("priceSwitch").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-price]");
      if (!btn) return;
      state.priceBand = btn.dataset.price;
      render();
    });
    document.getElementById("clearFilters").onclick = () => {
      state.category = "all";
      state.query = "";
      state.favOnly = false;
      state.priceBand = "all";
      clearTimeout(searchTimer);
      const box = document.getElementById("q");
      if (box) box.value = "";
      render();
    };
    document.getElementById("backupNow").onclick = exportBackup;
    document.getElementById("unsavedExport").onclick = exportBackup;
    document.getElementById("backupDismiss").onclick = () => {
      try {
        localStorage.setItem(BACKUP_SNOOZE_KEY, String(Date.now() + FORTNIGHT));
      } catch {
        toast("无法记下关闭时间，下次打开仍会提醒");
      }
      paintNotices();
    };
    document.getElementById("staleReload").onclick = () => location.reload();
    document.getElementById("updateReload").onclick = () => {
      const url = new URL(location.href);
      url.searchParams.set("_v", String(Date.now()));
      location.replace(url.toString());
    };
    window.addEventListener("beforeunload", (e) => {
      if (!state.unsaved) return;
      e.preventDefault();
      e.returnValue = "";
    });
    window.addEventListener("storage", (e) => {
      if (![STORAGE_KEY, GUN_FAV_KEY, TYPE_OVERRIDE_KEY].includes(e.key)) return;
      state.staleTab = true;
      paintNotices();
      toast("其他标签页已改过数据，请先刷新");
    });
    try {
      const manifest = {
        name: "三角洲改枪台",
        short_name: "改枪台",
        start_url: ".",
        display: "standalone",
        background_color: "#121212",
        theme_color: "#121212",
        icons: [{
          src: document.querySelector("link[rel=icon]").href,
          sizes: "any",
          type: "image/svg+xml",
          purpose: "any"
        }]
      };
      document.getElementById("manifestLink").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    } catch {}
    if (location.protocol === "http:" || location.protocol === "https:") {
      fetch(location.href, { cache: "no-store" }).then((res) => res.text()).then((text) => {
        const found = text.match(/APP_BUILD = "([^"]+)"/);
        if (found && found[1] !== APP_BUILD) document.getElementById("updateBar").hidden = false;
      }).catch(() => {});
    }

    document.getElementById("editName").addEventListener("change", () => {
      const input = document.getElementById("editName");
      const known = dictionaryWeapon(input.value);
      if (known) input.value = known.name;
      const name = input.value.trim();
      document.getElementById("editType").value = chooseType({
        name,
        code: document.getElementById("editCode").value,
        hint: document.getElementById("editType").value
      });
    });

    document.getElementById("editPrice").addEventListener("blur", (e) => {
      e.target.value = normalizePrice(e.target.value);
    });

    document.getElementById("editOverlay").addEventListener("click", (ev) => {
      if (ev.target.id === "editOverlay") closeEdit();
    });

    function syncViewport() {
      const vv = window.visualViewport;
      const height = vv ? vv.height : window.innerHeight;
      const kb = Math.max(0, window.innerHeight - height - (vv ? vv.offsetTop : 0));
      document.documentElement.style.setProperty("--vvh", Math.round(height) + "px");
      document.documentElement.style.setProperty("--kb", Math.round(kb) + "px");
    }
    syncViewport();
    window.addEventListener("resize", syncViewport);
    window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewport);
      window.visualViewport.addEventListener("scroll", syncViewport);
    }
    document.addEventListener("focusin", (e) => {
      const el = e.target;
      if (!(el instanceof HTMLElement)) return;
      if (!/INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
      clearTimeout(focusScrollTimer);
      focusScrollTimer = setTimeout(() => {
        focusScrollTimer = null;
        if (suppressInputScroll) return;
        syncViewport();
        el.scrollIntoView({ block: "center", inline: "nearest" });
      }, 300);
    });

    let seedAdded = 0;
    let fixed = 0;
    let retyped = 0;
    try {
      seedAdded = applySeed();
      fixed = reclassifyStored();
      retyped = applyKnownTypes();
    } catch (err) {}
    try {
      if (seedAdded) toast(`已同步新增 ${seedAdded} 套官方方案`);
      else if (fixed) toast(`已自动归类 ${fixed} 套方案`);
      else if (retyped) toast(`已自动归类 ${retyped} 套方案`);
      paintNotices();
    } catch (err) {}
    render();
  </script>
</body>
</html>
