<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="三角洲改枪台" />
  <meta name="application-name" content="三角洲改枪台" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff9500'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' fill='white' font-family='sans-serif'%3E%CE%94%3C/text%3E%3C/svg%3E" />

  </script>
  <title>三角洲改枪台</title>
  <style>
    :root {
      --bg: #121212;
      --bg-2: #181818;
      --panel: #1e1e1e;
      --panel-2: #242424;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8e8e8;
      --muted: #888888;
      --brand: #ff9500;
      --brand-2: #ffaa33;
      --gold: #ff9500;
      --green: #34c759;
      --red: #ff453a;
      --blue: #ff9500;
      --shadow: none;
      --shadow-hover: 0 0 0 1px rgba(255, 149, 0, 0.28);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --fast: 160ms;
      --med: 280ms;
      --slow: 420ms;
      --ar: #ff9500;
      --smg: #64d2ff;
      --dmr: #ffd60a;
      --lmg: #30d158;
      --sg: #bf5af2;
      --sr: #ff6482;
      --pistol: #ac8e68;
      --other: #8e8e93;
      --vvh: 100vh;
      --kb: 0px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
      --focus: rgba(255, 149, 0, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; max-width: 100%; }
    html, body, main { overflow-anchor: none; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      color-scheme: dark;
    }
    body {
      font-family: var(--font);
      font-variant-numeric: tabular-nums lining-nums;
      -webkit-tap-highlight-color: rgba(255, 149, 0, 0.18);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 36% at 0% -6%, rgba(255, 149, 0, 0.08), transparent 55%),
        radial-gradient(ellipse 46% 30% at 100% 0%, rgba(255, 255, 255, 0.03), transparent 50%),
        linear-gradient(180deg, #161616 0%, #121212 42%, #101010 100%);
      background-attachment: fixed;
      color: var(--text);
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
    }
    body::before,
    body::after { content: none; }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 14px 22px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 18, 18, 0.86);
      backdrop-filter: saturate(140%) blur(18px);
      -webkit-backdrop-filter: saturate(140%) blur(18px);
      box-shadow: none;
    }
    .head-top,
    .head-tools {
      display: flex;
      align-items: center;
      gap: 12px 16px;
      min-width: 0;
    }
    .head-tools { align-items: stretch; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }
    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      background: rgba(255, 149, 0, 0.14);
      border-radius: 12px;
      color: var(--brand);
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.03em;
    }
    .brand h1 {
      font-size: 24px;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-weight: 600;
    }
    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      letter-spacing: 0;
    }

    .search {
      flex: 0.8;
      position: relative;
      min-width: 180px;
    }
    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-size: 13px;
      border-radius: 12px;
    }
    .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--focus); }
    .search input::placeholder { color: var(--muted); }
    .search::before {
      content: "⌕";
      position: absolute;
      left: 12px;
      top: 9px;
      color: var(--muted);
      font-size: 18px;
    }

    .quick-add {
      flex: 1.3;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 240px;
    }
    .quick-add textarea {
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      overflow-y: auto;
      resize: none;
      padding: 10px 12px;
      font-size: 13px;
      border-radius: 12px;
    }
    .quick-add textarea:focus { height: 44px; min-height: 44px; max-height: 44px; }
    .quick-add button { height: 44px; min-width: 72px; white-space: nowrap; flex-shrink: 0; }

    .actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      height: 38px;
      padding: 0 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border-radius: 980px;
      transition:
        background var(--med) var(--ease),
        border-color var(--med) var(--ease),
        color var(--med) var(--ease),
        box-shadow var(--med) var(--ease),
        transform var(--med) var(--ease);
    }
    button, .btn, input, textarea {
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }
    select { touch-action: manipulation; border-radius: 12px; }
    input, textarea { border-radius: 12px; }
    button:hover, .btn:hover { background: var(--panel-2); border-color: rgba(255, 255, 255, 0.16); color: var(--text); }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--brand);
      border-color: transparent;
      color: #111;
      font-weight: 600;
      letter-spacing: 0;
      box-shadow: none;
    }
    .btn-primary:hover { background: var(--brand-2); color: #111; border-color: transparent; }
    .btn-ghost { background: var(--panel); }

    .layout {
      display: grid;
      grid-template-columns: 228px 1fr;
      min-height: 0;
    }

    aside {
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      overflow: auto;
      background: rgba(18, 18, 18, 0.72);
    }
    .aside-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: 500;
      padding: 0 10px 10px;
    }
    #cats { display: flex; flex-direction: column; }
    .cat {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      padding: 0 10px 0 12px;
      margin-bottom: 6px;
      background: transparent;
      text-align: left;
      color: var(--muted);
      position: relative;
      transition:
        background var(--med) var(--ease),
        border-color var(--med) var(--ease),
        color var(--med) var(--ease),
        box-shadow var(--med) var(--ease),
        transform var(--med) var(--ease);
    }
    .cat::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 8px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.7;
    }
    .cat b { font-weight: 500; flex: 1; }
    .cat.active {
      background: var(--brand);
      border-color: transparent;
      color: #111;
      box-shadow: none;
    }
    .cat.active::before { background: #111; opacity: 0.7; }
    .cat.active .count {
      background: rgba(0, 0, 0, 0.18);
      color: #111;
    }
    .count {
      min-width: 24px;
      height: 20px;
      padding: 0 6px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      border-radius: 980px;
      text-align: center;
    }

    main {
      min-height: 0;
      overflow: auto;
      padding: 18px 22px 80px;
    }
    main::-webkit-scrollbar, aside::-webkit-scrollbar { width: 10px; }
    main::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .view-switch { display: flex; gap: 6px; flex-shrink: 0; }
    .view-switch button { height: 32px; padding: 0 12px; background: var(--panel); }
    .view-switch button.active {
      background: var(--brand);
      border-color: transparent;
      color: #111;
    }
    .view-switch button.active:hover { background: var(--brand-2); color: #111; }
    .hint { color: var(--muted); font-size: 13px; }
    .pill {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 980px;
      padding: 3px 10px;
    }

    .gun-block {
      margin-bottom: 30px;
      animation: riseIn 360ms var(--ease) both;
    }
    .gun-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18, 18, 18, 0.98), rgba(18, 18, 18, 0.92));
    }
    .gun-head h2 {
      font-size: 22px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    .tag {
      font-size: 12px;
      font-weight: 600;
      color: #111;
      border: 1px solid transparent;
      border-radius: 980px;
      background: var(--brand);
      padding: 3px 8px;
    }
    .gun-head .tag-btn {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      background: var(--panel);
    }
    .gun-head .btn-fav {
      width: 40px;
      min-width: 40px;
      height: 40px;
      margin-right: 0;
    }
    #confirmTypeWrap { margin-top: 12px; }
    #confirmType { height: 44px; font-size: 16px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 14px 14px 12px 16px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: fadeIn 280ms var(--ease) both;
      transition:
        background var(--med) var(--ease),
        border-color var(--med) var(--ease),
        color var(--med) var(--ease),
        box-shadow var(--med) var(--ease),
        transform var(--med) var(--ease);
    }
    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      background: var(--accent, var(--brand));
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .card:active { transform: translateY(0); }
    .card.is-new {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(255, 149, 0, 0.35), var(--shadow-hover);
      animation: cardMark 1.8s var(--ease) 1;
    }
    @keyframes cardMark {
      0% { box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.55), var(--shadow-hover); }
      100% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0), var(--shadow); }
    }
    .more { position: relative; }
    .more-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      min-width: 168px;
      padding: 6px;
      border-radius: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .more-menu button {
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .more-menu button:hover { background: var(--panel-2); }
    .notice {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .notice[hidden] { display: none; }
    .notice.warn { color: #ffb340; }
    .notice button {
      margin-left: auto;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      font: inherit;
      cursor: pointer;
    }
    .notice .notice-x {
      margin-left: 0;
      width: 32px;
      padding: 0;
    }
    .price-switch, .view-switch { display: flex; flex-wrap: wrap; gap: 6px; }
    .price-switch button, #clearFilters {
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .price-switch button.active { color: #111; border-color: transparent; background: var(--brand); }
    .unknown-hint { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .compare-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .compare-card {
      flex: 0 0 min(240px, 78vw);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .compare-card p { margin: 0 0 8px; word-break: break-all; }
    .compare-pick { display: flex; flex-direction: column; gap: 8px; }
    .compare-pick label { display: flex; gap: 8px; align-items: flex-start; }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }
    .note-title {
      flex: 1;
      min-width: 0;
      height: auto;
      min-height: 28px;
      margin: 0;
      padding: 2px 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
    }
    .note-title.empty { color: var(--muted); font-weight: 600; }
    .note-title:hover { background: transparent; border-color: var(--line); color: var(--text); transform: none; }
    .note-title.editing { display: none; }
    .price {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--brand);
      padding: 6px 10px;
      border: 1px solid rgba(255, 149, 0, 0.22);
      border-radius: 980px;
      background: rgba(255, 149, 0, 0.1);
    }
    .price small {
      font-size: 12px;
      margin-left: 1px;
      color: var(--brand);
      font-weight: 700;
      opacity: 0.85;
    }
    .price.empty {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      border-color: var(--line);
      background: transparent;
    }
    button.price { cursor: text; }
    button.price:hover { border-color: rgba(255, 149, 0, 0.45); background: rgba(255, 149, 0, 0.16); color: var(--brand); transform: none; }
    button.price:active { transform: none; }
    .price.editing { display: none; }
    .price-input {
      display: none;
      margin-left: auto;
      width: 92px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--brand);
      border-radius: 980px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      outline: none;
    }
    .price-input.editing { display: block; }
    .note-input {
      display: none;
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .note-input.editing { display: block; }
    .note-input:focus { border-color: var(--brand); }
    .note-input::placeholder { color: #666; font-weight: 400; }
    .code-line {
      position: relative;
      display: block;
      width: 100%;
      height: 36px;
      padding: 0 72px 0 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: #b0b0b0;
      font-family: var(--mono);
      letter-spacing: -0.01em;
      border-radius: 10px;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .code-line:hover { border-color: var(--brand); color: var(--brand); }
    .code-line.copied {
      color: var(--green);
      border-color: var(--green);
      background: rgba(52, 199, 89, 0.12);
    }
    .code-line.copied::after {
      content: "已复制";
      position: absolute;
      right: 8px;
      top: 8px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--green);
    }
    .card-ops { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .card-ops button { height: 36px; padding: 0 12px; font-size: 12px; }
    .btn-fav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      min-width: 40px;
      height: 40px;
      margin-right: auto;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: #666;
      flex-shrink: 0;
      transition: color 180ms var(--ease), background-color 180ms var(--ease);
    }
    .card-ops .btn-fav { width: 40px; min-width: 40px; height: 40px; padding: 0; }
    .btn-fav svg {
      width: 20px;
      height: 20px;
      display: block;
      overflow: visible;
      pointer-events: none;
    }
    .btn-fav svg path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 180ms var(--ease), stroke 180ms var(--ease);
    }
    .btn-fav.on { color: var(--brand); }
    .btn-fav.on svg {
      filter: drop-shadow(0 1px 2px rgba(255, 149, 0, 0.35));
    }
    .btn-fav.on svg path { fill: currentColor; stroke: currentColor; stroke-width: 0.8; }
    .btn-fav:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: transparent;
      color: #aaa;
      transform: none;
    }
    .btn-fav.on:hover {
      background: rgba(255, 149, 0, 0.14);
      border-color: transparent;
      color: var(--brand-2);
      transform: none;
    }
    .btn-fav:active,
    .btn-fav.on:active { transform: none; }
    .btn-del { color: var(--red); border-color: rgba(255, 69, 58, 0.35); background: var(--panel); }
    .btn-del:hover { color: var(--red); background: rgba(255, 69, 58, 0.12); border-color: rgba(255, 69, 58, 0.5); }
    .btn-danger {
      background: rgba(255, 69, 58, 0.14);
      border-color: rgba(255, 69, 58, 0.4);
      color: var(--red);
      font-weight: 600;
    }
    .btn-danger:hover { color: #ff6961; border-color: rgba(255, 69, 58, 0.55); filter: none; }

    .board-empty {
      margin: 90px auto 0;
      max-width: 420px;
      text-align: center;
      color: var(--muted);
      padding: 36px 20px;
      border: 1px dashed var(--line);
    }
    .board-empty h3 { color: var(--text); margin-bottom: 8px; font-size: 20px; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      opacity: 0;
      visibility: hidden;

  <div class="app">

          </div>
        </div>
      </div>
      <div class="notice" id="backupBar" hidden>

        writeTypeOverrides(snap.typeOverrides);
        save();
        hideToast();
        render();
        return;
      }
      if (!undoBatch || !undoBatch.length) return;
      const entries = undoBatch.slice().sort((a, b) => a.index - b.index);
      undoBatch = null;
      clearTimeout(toast._t);
      entries.forEach(({ index, item }) => {
        state.items.splice(Math.min(index, state.items.length), 0, item);
      });
      save();
      hideToast();
      const notes = revealItems(entries.map((entry) => entry.item.id));
      if (notes.length) toast(notes.join("。"));
    }

    function removeByIds(ids, message) {
      const idSet = new Set(ids);
      const entries = [];
      state.items.forEach((item, index) => {
        if (idSet.has(item.id)) entries.push({ index, item: { ...item } });
      });
      if (!entries.length) return;
      state.items = state.items.filter((item) => !idSet.has(item.id));
      if (state.editingId && idSet.has(state.editingId)) closeEdit();
      save();
      render();
      rememberRemoval(entries, message);
    }

    function priceValue(p) {
      const m = String(p || "").match(/(\d+(?:\.\d+)?)/);
      if (!m) return -1;
      const n = Number(m[1]);
      if (/k/i.test(p)) return n * 1000;
      return n * 10000;
    }

    function displayPrice(p) {
      if (!p) return { html: "未标价", empty: true };
      const m = String(p).match(/^(\d+(?:\.\d+)?)([wWkK万千])?$/);
      if (!m) return { html: escapeHtml(p), empty: false };
      const unit = m[2] ? String(m[2]).toLowerCase() : "";
      const label = unit === "w" || unit === "万" ? "万" : unit === "k" || unit === "千" ? "千" : "";
      return { html: `${escapeHtml(m[1])}${label ? `<small>${label}</small>` : ""}`, empty: false };
    }

    function normalizePrice(raw) {
      if (!raw) return "";
      const text = String(raw).trim();
      if (!text) return "";
      const m = text.match(/(\d+(?:\.\d+)?)\s*([wWkK万千])?/);
      if (!m) return text;
      const n = m[1];
      const u = (m[2] || "").toLowerCase();
      if (u === "w" || u === "万") return n + "w";
      if (u === "k" || u === "千") return n + "k";
      if (Number(n) >= 10000) {
        const w = Number(n) / 10000;
        return (Number.isInteger(w) ? w : w.toFixed(1)) + "w";
      }
      return n + (u || "");
    }

    function extractPrice(text) {
      const labeled = text.match(/(?:价格|造价|价|price|cost)\s*[:：]?\s*(\d+(?:\.\d+)?)\s*([wWkK万千])?/i);
      if (labeled) return normalizePrice(labeled[1] + (labeled[2] || ""));
      const unit = text.match(/(\d+(?:\.\d+)?)\s*([wW万])/);
      if (unit) return normalizePrice(unit[0]);
      return "";
    }

    function stripPrice(text) {
      return text
        .replace(/(?:价格|造价|价|price|cost)\s*[:：]?\s*\d+(?:\.\d+)?\s*[wWkK万千]?/gi, " ")
        .replace(/\b\d+(?:\.\d+)?\s*[wW万]\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeRe(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function hasToken(text, token) {
      if (!token) return false;
      if (/[\u4e00-\u9fa5]/.test(token)) return text.toLowerCase().includes(token.toLowerCase());
      const re = new RegExp(`(^|[^a-z0-9])${escapeRe(token)}(?=$|[^a-z0-9])`, "i");
      return re.test(text);
    }

    function findWeapon(text) {
      const known = dictionaryWeapon(text);
      if (known) return known;
      const raw = String(text || "").replace(/[【】\[\]()（）]/g, " ").trim();
      const title = raw.match(/^[\w\u4e00-\u9fa5\-_.]{2,20}$/);
      if (title && !/提交/.test(title[0])) return { type: "other", name: title[0] };
      return null;
    }

    function dictionaryWeapon(text) {
      const raw = String(text || "").replace(/[【】\[\]()（）]/g, " ").trim();
      if (!raw) return null;
      let best = null;
      let bestLen = 0;
      for (const w of WEAPONS) {
        const tokens = [w.name, ...w.aliases];
        for (const token of tokens) {
          if (token.length > bestLen && hasToken(raw, token)) {
            best = w;
            bestLen = token.length;
          }
        }
      }
      return best;
    }

    function isSeparator(line) {
      const s = String(line || "").trim();
      if (!s) return true;
      return /^[-–—=_*~.]{1,}$/.test(s);
    }

    function looksLikeCode(line) {
      const s = line.trim();
      if (isSeparator(s)) return false;
      if (s.length < 8) return false;
      if (/(价格|造价|备注|压枪|适合|推荐)/.test(s) && s.length < 40) return false;
      const compact = s.replace(/\s/g, "");
      const alnum = compact.replace(/[-_+=\/]/g, "");
      if (alnum.length < 6) return false;
      return /^[A-Za-z0-9_\-+=\/]{8,}$/.test(compact);
    }

    function extractCodeToken(text) {
      const s = String(text || "").replace(/`/g, "");
      if (!s.trim()) return "";
      const long = [...s.matchAll(/[A-Za-z0-9]{16,}/g)];
      if (long.length) return long[long.length - 1][0];
      const compact = s.trim().replace(/\s/g, "");
      if (looksLikeCode(compact)) return compact.replace(/[-_+=\/]/g, "").length >= 8 ? compact : "";
      const fallback = [...s.matchAll(/[A-Za-z0-9_\-+=\/]{8,}/g)]
        .map((m) => m[0])
        .filter((tok) => {
          const alnum = tok.replace(/[-_+=\/]/g, "");
          return alnum.length >= 8 && /[A-Za-z]/.test(alnum) && /\d/.test(alnum);
        });
      return fallback.length ? fallback[fallback.length - 1] : "";
    }

    function joinNoteParts(...parts) {
      const out = [];
      const seen = new Set();
      parts.flatMap((p) => String(p || "").split(/\s*·\s*/)).forEach((part) => {
        const t = String(part || "").trim();
        if (!t || isSeparator(t) || seen.has(t)) return;
        seen.add(t);
        out.push(t);
      });
      return out.join(" · ");
    }

    function isCommentLine(line) {
      return /^\s*#/.test(String(line || ""));
    }

    function isNoteOnlyLine(line) {
      const s = String(line || "").trim();
      if (!s) return false;
      if (extractCodeToken(s)) return false;
      if (/^(屏注|备注|说明)\s*[:：]/.test(s)) return true;
      if (/^P\.?\s*S\.?\s*[:.：]/i.test(s)) return true;
      if (/^P\.?\s*S\./i.test(s)) return true;
      return false;
    }

    function normalizeHeader(line) {
      return line.replace(/[*＊]/g, "").replace(/[（(][^）)]*[）)]/g, "").trim();
    }

    function resolveWeaponLabel(label) {
      const text = String(label || "").replace(/[*＊]/g, "").trim();
      if (!text) return null;
      const known = dictionaryWeapon(text);
      if (known) return { name: known.name, type: known.type };
      const bare = normalizeHeader(text);
      const split = splitWeaponAndType(bare || text);
      if (split && split.name) {
        const again = dictionaryWeapon(split.name) || dictionaryWeapon(bare);
        if (again) return { name: again.name, type: again.type };
        if (bare !== text || CATEGORY_SUFFIX.some(([cat]) => (bare || text).endsWith(cat))) {
          return { name: split.name, type: split.type };
        }
      }
      if (bare && /^[\w.\-\u4e00-\u9fa5 ]{2,24}$/.test(bare)) {
        const w = dictionaryWeapon(bare) || findWeapon(bare);
        if (w) return { name: w.name, type: w.type };
      }
      return null;
    }

    function parseGunHeader(line) {
      const raw = String(line || "").trim();
      if (!raw || isCommentLine(raw) || isSeparator(raw)) return null;
      if (extractCodeToken(raw)) return null;
      if (raw.includes("·") || /烽火地带/.test(raw) || /提交/.test(raw)) return null;
      if (isNoteOnlyLine(raw)) return null;
      if (/^(通用改枪码|改枪码|配件码|方案码|代码)\s*[:：]/i.test(raw)) return null;

      let left = raw;
      let tierNote = "";
      const pipe = raw.match(/^(.+?)\s*[|｜]\s*(.+)$/);
      if (pipe) {
        left = pipe[1].trim();
        tierNote = pipe[2].trim();
      }

      const starred = left.replace(/[*＊]/g, "").trim();
      const bare = normalizeHeader(starred);
      const hasSuffix = CATEGORY_SUFFIX.some(([cat]) => bare.endsWith(cat) || starred.replace(/[（(][^）)]*[）)]/g, "").trim().endsWith(cat));
      const resolved = resolveWeaponLabel(starred);
      if (!resolved) return null;

      if (!pipe && !hasSuffix) {
        const title = bare || starred;
        if (!/^[\w.\-\u4e00-\u9fa5 ]{1,24}$/.test(title)) return null;
        const tokens = [resolved.name, ...(WEAPONS.find((w) => w.name === resolved.name)?.aliases || [])];
        const exact = tokens.some((tok) => title.toLowerCase() === String(tok).toLowerCase());
        const near = title.length <= resolved.name.length + 4;
        if (!exact && !near) return null;
        if (/[，。！？；、]/.test(title) || /不如|直接|建议|可以|还是|不要/.test(title)) return null;
      }

      return { name: resolved.name, type: resolved.type, tierNote };
    }

    function parsePlanLine(line, current) {
      const raw = String(line || "").trim();
      if (!raw || isCommentLine(raw) || isSeparator(raw)) return null;

      const share = parseShareLine(raw, current);
      if (share) return share;

      const labeled = raw.match(/^(?:通用改枪码|改枪码|配件码|方案码|代码)\s*[:：]\s*(.+)$/i);
      let code = "";
      let rest = raw;
      if (labeled) {
        code = extractCodeToken(labeled[1]) || labeled[1].replace(/`/g, "").trim();
        rest = "";
      } else {
        code = extractCodeToken(raw);
        if (!code) return null;
        rest = raw.replace(/`/g, "");
        const at = rest.lastIndexOf(code);
        if (at >= 0) rest = (rest.slice(0, at) + rest.slice(at + code.length)).trim();
        rest = rest.replace(/[:：\-–—]+\s*$/, "").trim();
      }
      if (!code || isSeparator(code)) return null;

      const price = extractPrice(raw);
      let planName = stripPrice(rest)
        .replace(/^(?:通用改枪码|改枪码|配件码|方案码|代码)\s*[:：]?\s*/i, "")
        .replace(/\s+/g, " ")
        .trim();
      if (planName && (looksLikeCode(planName) || planName === code)) planName = "";

      const fromLine = weaponFromLineLabel(planName);
      let name = "";
      let type = "";
      let ownGun = false;
      if (fromLine && fromLine.named) {
        ownGun = true;
        name = fromLine.name;
        type = fromLine.type;
        if (fromLine.zone) {
          planName = "";
        } else {
          const tokens = [fromLine.name, ...(WEAPONS.find((w) => w.name === fromLine.name)?.aliases || [])];
          let leftover = planName;
          tokens.slice().sort((a, b) => b.length - a.length).forEach((tok) => {
            leftover = leftover.replace(new RegExp(escapeRe(tok), "i"), " ");
          });
          leftover = leftover.replace(/[-–—|｜]/g, " ").replace(/烽火地带/g, " ").replace(/\s+/g, " ").trim();
          planName = leftover.length > 1 ? leftover : "";
        }
      } else if (fromLine && fromLine.zone) {
        ownGun = true;
        name = "未识别";
        type = fromLine.type || "other";
        planName = "";
      } else if (current && current.name) {
        name = current.name;
        type = current.type || "";
      }
      if (!name) name = "未识别";
      if (!type) type = chooseType({ name, code, hint: "other" });
      const tier = !ownGun && current ? current.tierNote : "";
      const note = joinNoteParts(planName, tier);
      return { name, type, code, price: price || "", note, ownGun };
    }

    function parseZoneLine(line) {
      const raw = String(line || "").trim();
      const m = raw.match(/^(.+?)-烽火地带-([A-Za-z0-9]{8,})\s*$/);
      if (!m) return null;
      const label = m[1].trim();
      const code = m[2];
      const known = dictionaryWeapon(label);
      if (known) return { name: known.name, type: known.type, code, price: "", note: "", ownGun: true };
      const split = splitWeaponAndType(label);
      if (split && split.name) {
        const again = dictionaryWeapon(split.name);
        if (again) return { name: again.name, type: again.type, code, price: "", note: "", ownGun: true };
        if (split.type && split.type !== "other") return { name: split.name, type: split.type, code, price: "", note: "", ownGun: true };
      }
      const cat = CATEGORY_SUFFIX.find(([word]) => label === word);
      if (cat) return { name: "未识别", type: cat[1], code, price: "", note: "", ownGun: true };
      return { name: "未识别", type: "other", code, price: "", note: "", ownGun: true };
    }

    function explicitGunLabel(text) {
      const raw = String(text || "").trim();
      if (!raw || raw.length > 80 || /不如|直接玩|建议|可以|还是|不要/.test(raw)) return null;
      const zone = raw.match(/^(.+?)-烽火地带/);
      const label = (zone ? zone[1] : raw).replace(/[·｜]/g, " ").trim();
      if (!label) return null;
      const known = dictionaryWeapon(label);
      const hasSuffix = CATEGORY_SUFFIX.some(([cat]) => label === cat || label.endsWith(cat));
      if (known && (zone || hasSuffix)) return { name: known.name, type: known.type };
      if (known) {
        const tokens = [known.name, ...(known.aliases || [])];
        if (tokens.some((tok) => label.toLowerCase() === String(tok).toLowerCase())) return { name: known.name, type: known.type };
      }
      return null;
    }

    function stripGunLabelNote(note) {
      const picked = explicitGunLabel(note);
      if (!picked) return String(note || "").trim();
      let text = String(note || "").replace(/-?\s*烽火地带\s*/g, " ");
      const weapon = WEAPONS.find((w) => w.name === picked.name);
      const tokens = [picked.name, ...((weapon && weapon.aliases) || [])].filter(Boolean).sort((a, b) => b.length - a.length);
      tokens.forEach((tok) => {
        if (tok.length < 2) return;
        text = text.split(tok).join(" ");
        text = text.split(String(tok).toLowerCase()).join(" ");
      });
      CATEGORY_SUFFIX.forEach(([cat]) => {
        text = text.split(cat).join(" ");
      });
      return text.replace(/[·｜]/g, " ").replace(/\s+/g, " ").trim();
    }

    function reclassifyStored() {
      let changed = 0;
      state.items.forEach((item) => {
        try {
          const before = [item.name, item.type, item.note].join("\n");
          const fromNote = explicitGunLabel(item.note);
          const knownName = dictionaryWeapon(item.name);
          const picked = fromNote || (knownName ? { name: knownName.name, type: knownName.type } : null);
          if (picked && picked.name) {
            item.name = picked.name;
            item.type = overrideType(picked.name) || picked.type || item.type || "other";
            if (fromNote) item.note = stripGunLabelNote(item.note);
          }
          if (before !== [item.name, item.type, item.note].join("\n")) changed += 1;
        } catch (err) {}
      });
      if (changed) save();
      return changed;
    }

    function stripZoneLabel(text) {
      return String(text || "")
        .replace(/[-–—\s]*烽火地带[-–—\s]*$/i, "")
        .replace(/[-–—:：\s]+$/g, "")
        .trim();
    }

    function weaponFromLineLabel(planName) {
      const raw = String(planName || "").trim();
      if (!raw) return null;
      const zone = /烽火地带/.test(raw);
      const label = stripZoneLabel(raw);
      if (!label) return zone ? { name: "", type: "other", named: false, zone: true } : null;
      const known = dictionaryWeapon(label);
      if (known) return { name: known.name, type: known.type, named: true, zone };
      const split = splitWeaponAndType(label);
      if (split && split.name) {
        const again = dictionaryWeapon(split.name);
        if (again) return { name: again.name, type: again.type, named: true, zone };
      }
      const catOnly = CATEGORY_SUFFIX.find(([cat]) => label === cat);
      if (catOnly) return { name: "", type: catOnly[1], named: false, zone: true };
      if (zone && split && split.type && split.type !== "other") {
        return { name: split.name || "", type: split.type, named: !!split.name, zone: true };
      }
      return null;
    }

    function inferTypeFromCode(code) {
      const text = String(code || "").replace(/\s+/g, "").toLowerCase();
      if (!text) return null;
      const keywords = [
        ["精确射手步枪", "dmr"],
        ["精确射手", "dmr"],
        ["紧凑突击步枪", "ar"],
        ["突击步枪", "ar"],
        ["战斗步枪", "ar"],
        ["射手步枪", "dmr"],
        ["狙击步枪", "sr"],
        ["通用机枪", "lmg"],
        ["轻机枪", "lmg"],
        ["冲锋枪", "smg"],
        ["霰弹枪", "sg"],
        ["杠杆式步枪", "dmr"],
        ["杠杆步枪", "dmr"],
        ["手枪", "pistol"],
        ["复合弓", "other"]
      ];
      for (const [word, type] of keywords) {
        if (text.includes(word.toLowerCase())) return type;
      }
      return null;
    }

    function gunKey(name) {
      return String(name || "").trim().toLowerCase();
    }

    function readTypeOverrides() {
      try {
        const data = JSON.parse(localStorage.getItem(TYPE_OVERRIDE_KEY) || "{}");
        if (!data || typeof data !== "object" || Array.isArray(data)) return {};
        return data;
      } catch {
        return {};
      }
    }

    let typeOverrideTable = readTypeOverrides();

    function writeTypeOverrides(table) {
      typeOverrideTable = table && typeof table === "object" && !Array.isArray(table) ? table : {};
      if (state.staleTab) {
        toast("其他标签页已改过数据，请先刷新，避免覆盖");
        return false;
      }
      try {
        localStorage.setItem(TYPE_OVERRIDE_KEY, JSON.stringify(typeOverrideTable));
        return true;
      } catch {
        state.unsaved = true;
        paintNotices();
        toast("还没保存到本机，类型记忆请立即导出");
        return false;
      }
    }

    function overrideType(name) {
      const value = typeOverrideTable[gunKey(name)];
      return value && TYPE_NAME[value] && value !== "all" ? value : null;
    }

    function rememberType(name, type) {
      const key = gunKey(name);
      if (!key || !TYPE_NAME[type] || type === "all") return;
      const table = { ...typeOverrideTable };
      table[key] = type;
      writeTypeOverrides(table);
      state.items.forEach((item) => {
        if (gunKey(item.name) === key) item.type = type;
      });
    }

    function chooseType({ name, code, hint }) {
      const forced = overrideType(name);
      if (forced) return forced;
      const inferred = inferTypeFromCode(code) || inferTypeFromCode(name);
      if (inferred) return inferred;
      const known = dictionaryWeapon(name);
      if (known) return known.type;
      if (hint && TYPE_NAME[hint] && hint !== "all") return hint;
      return "other";
    }

    function suggestType(item) {
      if (overrideType(item.name)) return null;
      const inferred = inferTypeFromCode(item.code) || inferTypeFromCode(item.name);
      if (inferred) return inferred;
      const known = dictionaryWeapon(item.name);
      return known ? known.type : null;
    }

    function applyKnownTypes() {
      let changed = 0;
      state.items.forEach((item) => {
        const forced = overrideType(item.name);
        if (forced) {
          if (item.type !== forced) {
            item.type = forced;
            changed += 1;
          }
          return;
        }
        if (item.type && item.type !== "other") return;
        const next = suggestType(item);
        if (next && next !== "other" && next !== item.type) {
          item.type = next;
          changed += 1;
        }
      });
      if (changed) save();
      return changed;
    }

    function retypeUnlocked() {
      let changed = 0;
      state.items.forEach((item) => {
        const next = suggestType(item);
        if (!next || next === item.type) return;
        item.type = next;
        changed += 1;
      });
      if (changed) save();
      render();
      toast(changed ? `已更新 ${changed} 条分类` : "没有需要更新的分类");
    }
    function splitWeaponAndType(label) {
      const text = String(label || "").trim();
      if (!text) return null;
      const inferred = inferTypeFromCode(text);
      for (const [cat, type] of CATEGORY_SUFFIX) {
        if (text.endsWith(cat)) {
          const bare = text.slice(0, -cat.length).trim();
          const known = dictionaryWeapon(bare);
          return { name: known ? known.name : bare, type: known ? known.type : (inferred || type) };
        }
      }
      const known = dictionaryWeapon(text);
      if (known) return { name: known.name, type: inferred || known.type };
      if (inferred) return { name: text, type: inferred };
      return { name: text, type: "other" };
    }

    function parseShareLine(line, current) {
      const m = line.match(/^(.*?)\s*·\s*(?:(\d+(?:\.\d+)?)\s*([wW万])\s+)?(?:(.+?)-烽火地带-)?([A-Za-z0-9]{16,})\s*[—\-]?\s*$/);
      if (!m) return null;
      let note = (m[1] || "").trim();
      if (isSeparator(note) || note === "—" || note === "-") note = "";
      const price = m[2] ? normalizePrice(m[2] + (m[3] || "")) : "";
      const label = (m[4] || "").trim();
      const parsed = label ? splitWeaponAndType(label) : current;
      const name = (parsed && parsed.name) || (current && current.name) || "未识别";
      const type = (parsed && parsed.type) || (current && current.type) || "other";
      return { name, type, code: m[5], price, note };
    }

    function parseBulk(text) {
      const cleaned = text.replace(/\r/g, "").trim();
      if (!cleaned) return [];
      if (cleaned.startsWith("[") || cleaned.startsWith("{")) {
        try {
          const data = JSON.parse(cleaned);
          const arr = Array.isArray(data) ? data : (data.items || []);
          return arr.map((r) => ({
            name: r.name || "未识别",
            type: r.type || (findWeapon(r.name || "") || {}).type || "other",
            code: r.code || "",
            price: normalizePrice(r.price || ""),
            note: r.note || ""
          }));
        } catch {}
      }

      const entries = [];
      let current = null;
      let lastEntry = null;
      let pendingNote = "";

      const pushEntry = (row) => {
        if (!row || !row.code || isSeparator(row.code)) return;
        const item = {
          name: row.name || "未识别",
          type: row.type || "other",
          code: row.code,
          price: normalizePrice(row.price || ""),
          note: row.note || ""
        };
        item.ownGun = row.ownGun === true;
        entries.push(item);
        lastEntry = item;
        current = {
          name: item.name,
          type: item.type,
          tierNote: current && current.name === item.name ? (current.tierNote || "") : ""
        };
      };

      const appendNote = (line) => {
        if (!lastEntry) return;
        let note = String(line || "").trim();
        note = note.replace(/^(屏注|备注|说明)\s*[:：]\s*/, "");
        note = note.replace(/^P\.?\s*S\.?\s*[:.：]\s*/i, "");
        note = note.trim();
        if (!note || isSeparator(note)) return;
        lastEntry.note = joinNoteParts(lastEntry.note, note);
      };

      const rawLines = cleaned.split("\n");
      for (const raw of rawLines) {
        const line = raw.trim();
        if (isCommentLine(line)) continue;
        if (isSeparator(line)) continue;

        const zoneLine = parseZoneLine(line);
        if (zoneLine) {
          if (pendingNote) {
            zoneLine.note = joinNoteParts(pendingNote, zoneLine.note);
            pendingNote = "";
          }
          pushEntry(zoneLine);
          continue;
        }

        const header = parseGunHeader(line);
        if (header) {
          pendingNote = "";
          current = { name: header.name, type: header.type, tierNote: header.tierNote || "" };
          continue;
        }

        const plan = parsePlanLine(line, current);
        if (plan) {
          if (pendingNote) {
            plan.note = joinNoteParts(pendingNote, plan.note);
            pendingNote = "";
          }
          pushEntry(plan);
          continue;
        }

        if (/^(?!屏注|备注|说明)([^:：]{1,12})[：:]$/.test(line)) {
          pendingNote = joinNoteParts(pendingNote, line.replace(/[：:]\s*$/, "").trim());
          continue;
        }

        if (isNoteOnlyLine(line) || (lastEntry && !extractCodeToken(line))) {
          if (lastEntry) {
            appendNote(line);
            continue;
          }
        }
      }

      return entries.filter((e) => e.code);
    }

    function renderCats() {
      const counts = Object.fromEntries(TYPES.map((t) => [t.id, 0]));
      counts.all = state.items.length;
      state.items.forEach((it) => {
        counts[it.type] = (counts[it.type] || 0) + 1;
      });
      document.getElementById("cats").innerHTML = TYPES.map((t) => `
        <button class="cat ${state.category === t.id ? "active" : ""}" data-id="${t.id}" style="--accent:${TYPE_COLOR[t.id]}">
          <b>${t.name}</b><span class="count">${counts[t.id] || 0}</span>
        </button>
      `).join("");
    }

    function inPriceBand(item) {
      if (state.priceBand === "all") return true;
      const value = priceValue(item.price);
      if (state.priceBand === "none") return value < 0;
      if (value < 0) return false;
      if (state.priceBand === "low") return value < 300000;
      if (state.priceBand === "mid") return value >= 300000 && value <= 600000;
      if (state.priceBand === "high") return value > 600000;
      return true;
    }

    function filtered() {
      const q = state.query.trim().toLowerCase();
      return state.items.filter((it) => {
        if (state.category !== "all" && it.type !== state.category) return false;
        if (state.favOnly && it.favorite !== true && !gunFavorite(it.name)) return false;
        if (!inPriceBand(it)) return false;
        if (!q) return true;
        return [it.name, it.code, it.price, it.note, TYPE_NAME[it.type]].join(" ").toLowerCase().includes(q);
      });
    }

    function starIcon() {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.48 3.5a.56.56 0 0 1 1.04 0l2.13 5.11a.56.56 0 0 0 .47.35l5.52.44a.56.56 0 0 1 .32.99l-4.2 3.6a.56.56 0 0 0-.18.56l1.28 5.38a.56.56 0 0 1-.84.61l-4.73-2.88a.56.56 0 0 0-.58 0l-4.73 2.88a.56.56 0 0 1-.84-.61l1.29-5.38a.56.56 0 0 0-.18-.56l-4.21-3.6a.56.56 0 0 1 .32-.99l5.52-.44a.56.56 0 0 0 .47-.35L11.48 3.5z"/></svg>`;
    }

    function renderBoard() {
      const items = filtered();
      document.querySelectorAll("#viewSwitch [data-view]").forEach((btn) => {
        btn.classList.toggle("active", state.favOnly ? btn.dataset.view === "fav" : btn.dataset.view === "all");
      });
      document.querySelectorAll("#priceSwitch [data-price]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.price === state.priceBand);
      });
      const filtering = state.category !== "all" || state.favOnly || state.priceBand !== "all" || state.query.trim();
      const clearBtn = document.getElementById("clearFilters");
      if (clearBtn) clearBtn.hidden = !filtering;
      const anyFav = state.items.some((it) => it.favorite === true || gunFavorite(it.name));
      document.getElementById("status").textContent = items.length
        ? (state.favOnly ? "收藏的枪在本分类置顶；同枪里收藏方案再按价格从高到低" : "同枪多套方案按价格从高到低排列")
        : (state.favOnly ? "点枪名星标可把该枪置顶本分类；点方案星标只在同枪方案里置顶。" : "粘贴改枪码后按回车生成，重复的不会添加");
      const gunCount = new Set(state.items.map((x) => x.name)).size;
      document.getElementById("stats").innerHTML = `
        <span class="pill">方案 ${state.items.length}</span>
        <span class="pill">枪种 ${gunCount}</span>
      `;
      if (!items.length) {
        const emptyTitle = state.favOnly ? (anyFav ? "没有匹配的收藏" : "还没有收藏") : (state.items.length ? "没有匹配结果" : "还没有改枪码");
        const emptyText = state.favOnly
          ? (anyFav ? "换个分类、价格或关键词，或清除筛选。" : "点枪名星标可把该枪置顶本分类；点方案星标只在同枪方案里置顶。")
          : (state.items.length ? "换个关键词、分类或价格，或清除筛选。" : "把改枪码贴到顶部输入框，按回车生成。");
        document.getElementById("board").innerHTML = `
          <div class="board-empty">
            <h3>${emptyTitle}</h3>
            <p>${emptyText}</p>
          </div>`;
        return;
      }
      const groups = new Map();
      items.forEach((it) => {
        const key = it.type + "::" + it.name;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(it);
      });
      groups.forEach((list) => list.sort((a, b) => {
        const fav = Number(b.favorite === true) - Number(a.favorite === true);
        if (fav) return fav;
        return priceValue(b.price) - priceValue(a.price);
      }));
      const order = TYPES.map((t) => t.id).filter((id) => id !== "all");
      const sorted = [...groups.entries()].sort((a, b) => {
        const [ta, na] = a[0].split("::");
        const [tb, nb] = b[0].split("::");
        const d = order.indexOf(ta) - order.indexOf(tb);
        if (d !== 0) return d;
        const fa = gunFavorite(na) ? 0 : 1;
        const fb = gunFavorite(nb) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        return na.localeCompare(nb, "zh");
      });
      const markup = sorted.map(([key, list]) => {
        const [type, name] = key.split("::");
        const accent = TYPE_COLOR[type] || TYPE_COLOR.other;
        const unknown = name === "未识别" ? `<p class="unknown-hint">未识别枪名。点「编辑」或「改分类」纠正，之后同名会沿用。</p>` : "";
        const compare = list.length >= 2 ? `<button type="button" class="tag-btn" data-compare="${escapeHtml(name)}" data-compare-type="${escapeHtml(type)}">对比</button>` : "";
        return `
          <section class="gun-block">
            <div class="gun-head">
              <button type="button" class="btn-fav ${gunFavorite(name) ? "on" : ""}" data-gun-fav="${escapeHtml(name)}" aria-pressed="${gunFavorite(name) ? "true" : "false"}" aria-label="${gunFavorite(name) ? "取消收藏该枪" : "收藏该枪"}">${starIcon()}</button>
              <h2>${escapeHtml(name)}</h2>
              <span class="tag">${TYPE_NAME[type] || "特殊"} · ${list.length} 套</span>
              ${compare}
              <button type="button" class="tag-btn" data-retype="${escapeHtml(name)}">改分类</button>
            </div>
            ${unknown}
            <div class="cards">
              ${list.map((it) => {
                const price = displayPrice(it.price);
                const note = (it.note || "").trim();
                return `
                <article class="card" data-id="${escapeHtml(it.id)}" style="--accent:${accent}${quietBoard ? ";animation:none" : ""}">
                  <div class="card-top">
                    <button type="button" class="note-title ${note ? "" : "empty"}" data-note-open="${it.id}">${escapeHtml(note || "未命名方案")}</button>
                    <input class="note-input" data-note="${it.id}" value="${escapeHtml(note)}" placeholder="备注，如性价比高" />
                    <button type="button" class="price ${price.empty ? "empty" : ""}" data-price-open="${it.id}" title="点击修改价格">${price.html}</button>
                    <input class="price-input" data-price="${it.id}" value="${escapeHtml(it.price || "")}" inputmode="decimal" enterkeyhint="done" placeholder="30w" aria-label="价格" />
                  </div>
                  <button type="button" class="code-line" data-copy="${it.id}" title="点击复制">${escapeHtml(it.code || "（空）")}</button>
                  <div class="card-ops">
                    <button type="button" class="btn-fav ${it.favorite ? "on" : ""}" data-fav="${it.id}" aria-pressed="${it.favorite ? "true" : "false"}" aria-label="${it.favorite ? "取消收藏" : "收藏"}">${starIcon()}</button>
                    <button type="button" data-share="${it.id}">分享</button>
                    <button type="button" data-edit="${it.id}">编辑</button>
                    <button type="button" class="btn-del" data-del="${it.id}">删除</button>
                  </div>
                </article>`;
              }).join("")}
            </div>
          </section>`;
      }).join("");
      document.getElementById("board").innerHTML = markup;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function render() {
      renderCats();
      renderBoard();
    }

    function readGunFavs() {
      try {
        const data = JSON.parse(localStorage.getItem(GUN_FAV_KEY) || "{}");
        if (!data || typeof data !== "object" || Array.isArray(data)) return {};
        return data;
      } catch {
        return {};
      }
    }

    let gunFavTable = readGunFavs();

    function gunFavorite(name) {
      return gunFavTable[name] === true;
    }

    function writeGunFavs(table) {
      gunFavTable = table && typeof table === "object" && !Array.isArray(table) ? table : {};
      if (state.staleTab) {
        toast("其他标签页已改过数据，请先刷新，避免覆盖");
        return false;
      }
      try {
        localStorage.setItem(GUN_FAV_KEY, JSON.stringify(gunFavTable));
        return true;
      } catch {
        state.unsaved = true;
        paintNotices();
        toast("还没保存到本机，枪组收藏请立即导出");
        return false;
      }
    }

    function mergeGunFavorites(incoming) {
      if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) return;
      const table = { ...gunFavTable };
      Object.entries(incoming).forEach(([name, on]) => {
        if (name && on === true) table[name] = true;
      });
      writeGunFavs(table);
    }

    function paintStar(btn, on, label) {
      if (!btn) return;
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.setAttribute("aria-label", label);
    }

    function favVisibleKey() {
      if (!state.favOnly) return "";
      return filtered().map((it) => it.id).join("|");
    }

    let quietBoard = false;

    function refreshBoardQuiet() {
      const scroller = document.querySelector("main");
      const snapshot = {
        x: window.scrollX,
        y: window.scrollY,
        main: scroller ? scroller.scrollTop : 0
      };
      const active = document.activeElement;
      if (active && active !== document.body && typeof active.blur === "function") {
        active.blur({ preventScroll: true });
      }
      quietBoard = true;
      renderBoard();
      quietBoard = false;
      const restore = () => {
        window.scrollTo(snapshot.x, snapshot.y);
        if (scroller) scroller.scrollTop = snapshot.main;
      };
      restore();
      requestAnimationFrame(restore);
    }

    function toggleItemFavorite(id, btn) {
      const item = state.items.find((x) => x.id === id);
      if (!item) return;
      const before = favVisibleKey();
      item.favorite = item.favorite !== true;
      save();
      const siblings = filtered().filter((it) => it.type === item.type && it.name === item.name);
      if ((state.favOnly && favVisibleKey() !== before) || siblings.length > 1) refreshBoardQuiet();
      else paintStar(btn, item.favorite === true, item.favorite ? "取消收藏" : "收藏");
    }

    function toggleGunFavorite(name, btn) {
      const before = favVisibleKey();
      const table = { ...gunFavTable };
      const next = table[name] !== true;
      if (next) table[name] = true;
      else delete table[name];
      writeGunFavs(table);
      const sample = state.items.find((it) => it.name === name);
      const gunsInType = new Set(filtered().filter((it) => sample && it.type === sample.type).map((it) => it.name));
      if ((state.favOnly && favVisibleKey() !== before) || gunsInType.size > 1) refreshBoardQuiet();
      else paintStar(btn, next, next ? "取消收藏该枪" : "收藏该枪");
    }

    function fillTypeSelect(selected) {
      document.getElementById("editType").innerHTML = TYPES.filter((t) => t.id !== "all").map((t) =>
        `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${t.name}</option>`
      ).join("");
    }

    function codeKey(code) {
      return String(code || "").replace(/\s/g, "").toLowerCase();
    }

    function findSame(item, list) {
      const key = codeKey(item.code);
      if (key) return list.find((x) => codeKey(x.code) === key) || null;
      return list.find((x) => x.name === item.name && !codeKey(x.code) && (x.price || "") === (item.price || "")) || null;
    }

    function addRows(rows) {
      let added = 0;
      let skipped = 0;
      let moved = 0;
      const ids = [];
      const dupIds = [];
      const seen = state.items.slice();
      rows.forEach((r) => {
        if (!r || typeof r !== "object") {
          skipped += 1;
          return;
        }
        const fromText = explicitGunLabel(r.note) || explicitGunLabel(r.name);
        const known = dictionaryWeapon((fromText && fromText.name) || r.name || "");
        const name = (fromText && fromText.name) || (known ? known.name : (r.name || "未识别"));
        const explicit = r.ownGun === true || !!fromText;
        const item = {
          id: uid(),
          name,
          type: chooseType({ name, code: String(r.code || ""), hint: (fromText && fromText.type) || r.type }),
          code: String(r.code || "").trim(),
          price: normalizePrice(r.price),
          note: fromText ? stripGunLabelNote(r.note) : String(r.note || "").trim(),
          favorite: r.favorite === true,
          createdAt: Date.now()
        };
        const same = findSame(item, seen);
        if (same) {
          if (explicit && dictionaryWeapon(name) && name !== same.name) {
            same.name = name;
            same.type = overrideType(name) || item.type;
            moved += 1;
          }
          if (item.favorite === true && same.favorite !== true) same.favorite = true;
          skipped += 1;
          if (same.id && !dupIds.includes(same.id)) dupIds.push(same.id);
          return;
        }
        seen.push(item);
        state.items.push(item);
        ids.push(item.id);
        added += 1;
      });
      return { added, skipped, ids, dupIds, moved };
    }

    let suppressInputScroll = false;
    let focusScrollTimer = null;
    let searchTimer = null;
    let highlightTimer = null;

    function itemMatchesQuery(item, query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return true;
      return [item.name, item.code, item.price, item.note, TYPE_NAME[item.type]].join(" ").toLowerCase().includes(q);
    }

    function ensureVisible(items) {
      const notes = [];
      const hiddenByCategory = items.some((item) => state.category !== "all" && item.type !== state.category);
      if (hiddenByCategory) {
        const types = new Set(items.map((item) => item.type));
        if (types.size === 1) {
          state.category = [...types][0];
          notes.push(`已切换到${TYPE_NAME[state.category] || "该分类"}，以显示该方案`);
        } else {
          state.category = "all";
          notes.push("已切换到全部，以显示该方案");
        }
      }
      if (state.query && items.some((item) => !itemMatchesQuery(item, state.query))) {
        state.query = "";
        clearTimeout(searchTimer);
        const box = document.getElementById("q");
        if (box) box.value = "";
        notes.push("已清空搜索，以显示该方案");
      }
      if (state.priceBand !== "all" && items.some((item) => !inPriceBand(item))) {
        state.priceBand = "all";
        notes.push("已取消价格筛选，以显示该方案");
      }
      if (state.favOnly && items.some((item) => item.favorite !== true && !gunFavorite(item.name))) {
        state.favOnly = false;
        notes.push("已退出只看收藏，以显示该方案");
      }
      return notes;
    }

    function cardById(id) {
      const value = window.CSS && CSS.escape ? CSS.escape(id) : String(id).replace(/"/g, '\\"');
      return document.querySelector(`article.card[data-id="${value}"]`);
    }

    function focusNewCards(ids) {
      const main = document.querySelector("main");
      const cards = ids.map(cardById).filter(Boolean);
      if (!main || !cards.length) return;
      cards.forEach((card) => card.classList.add("is-new"));
      cards.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
      const target = cards[0];
      const cardRect = target.getBoundingClientRect();
      const mainRect = main.getBoundingClientRect();
      const mainScrolls = /(auto|scroll)/.test(getComputedStyle(main).overflowY);
      const scroller = mainScrolls ? main : (document.scrollingElement || document.documentElement);
      const delta = cardRect.top - mainRect.top - (mainRect.height - cardRect.height) / 2;
      scroller.scrollTo({ top: Math.max(0, scroller.scrollTop + delta), behavior: "smooth" });
      clearTimeout(highlightTimer);
      highlightTimer = setTimeout(() => {
        cards.forEach((card) => card.classList.remove("is-new"));
      }, 1800);
    }

    function revealItems(ids) {
      const items = ids.map((id) => state.items.find((item) => item.id === id)).filter(Boolean);
      if (!items.length) return [];
      const notes = ensureVisible(items);
      suppressInputScroll = true;
      clearTimeout(focusScrollTimer);
      const box = document.getElementById("quickAdd");
      if (box && document.activeElement === box) box.blur();
      render();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => focusNewCards(ids));
      });
      setTimeout(() => {
        suppressInputScroll = false;
      }, 800);
      return notes;
    }

    function reportMerge(result, verb) {
      const dupIds = result.dupIds || [];
      const jumpIds = result.added ? result.ids : dupIds;
      const notes = jumpIds.length ? revealItems(jumpIds) : [];
      if (!jumpIds.length) render();
      const extra = notes.length ? `。${notes.join("。")}` : "";
      if (!result.added && result.skipped) {
        const base = result.moved
          ? `已有该改枪码，已把 ${result.moved} 套归到对应的枪`
          : (result.skipped === 1 ? "已有该改枪码" : `已有 ${result.skipped} 条相同改枪码，未重复添加`);
        toast(base + extra);
        return;
      }
      if (result.added) {
        let base = `新增 ${result.added} 条改枪码`;
        if (result.moved) base += `，${result.moved} 套已归到对应的枪`;
        else if (result.skipped) base += `，${result.skipped} 条已有`;
        base += "，Ctrl+Z 可撤回";
        rememberAdded(result.ids, base + extra);
        return;
      }
      toast(`${verb} ${result.added} 套方案` + extra);
    }

    function ingestText(text) {
      const rows = parseBulk(text);
      if (!rows.length) {
        toast("没有解析到改枪码");
        return false;
      }
      const result = addRows(rows);
      save();
      reportMerge(result, "已生成");
      return result.added > 0 || result.skipped > 0;
    }

    function appliedSeedVersion() {
      const current = localStorage.getItem(SEED_VERSION_KEY);
      if (current) return Number(current) || 0;
      if (localStorage.getItem(SEED_KEY)) return 1;
      return 0;
    }

    function applySeed() {
      if (appliedSeedVersion() >= SEED_VERSION) return 0;
      const { added } = addRows(parseBulk(SEED_TEXT));
      localStorage.setItem(SEED_VERSION_KEY, String(SEED_VERSION));
      save();
      return added;
    }

    function isBackup(data) {
      return !!(data && typeof data === "object" && !Array.isArray(data) && Array.isArray(data.items));
    }

    function classifyPaste(text) {
      const trimmed = String(text || "").trim();
      if (trimmed.startsWith(SHARE_PREFIX)) return { kind: "share", text: trimmed };
      if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
        let data;
        try {
          data = JSON.parse(trimmed);
        } catch {
          return { kind: "bad-json" };
        }
        if (Array.isArray(data)) return { kind: "rows", data };
        if (isBackup(data)) return { kind: "backup", data };
        return { kind: "bad-shape" };
      }
      return { kind: "codes", text: trimmed };
    }

    function rowsFrom(data) {
      if (Array.isArray(data)) return data.filter((row) => row && typeof row === "object");
      if (isBackup(data)) return data.items.filter((row) => row && typeof row === "object");
      return null;
    }

    function mergeTypeOverrides(incoming) {
      if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) return;
      const table = { ...typeOverrideTable };
      Object.entries(incoming).forEach(([key, type]) => {
        if (!key || table[key] || !TYPE_NAME[type] || type === "all") return;
        table[key] = type;
      });
      writeTypeOverrides(table);
    }

    function mergePayload(data) {
      const rows = rowsFrom(data);
      if (!rows) {
        toast("导入失败：不是方案数组");
        return false;
      }
      if (isBackup(data)) {
        mergeGunFavorites(data.gunFavorites);
        mergeTypeOverrides(data.typeOverrides);
      }
      if (!rows.length) {
        toast("没有可导入的方案");
        render();
        return true;
      }
      const result = addRows(rows);
      save();
      reportMerge(result, "已导入");
      return true;
    }

    function keptType(type, name, code) {
      if (type && TYPE_NAME[type] && type !== "all") return type;
      return chooseType({ name, code, hint: type });
    }

    function restoreBackup(data) {
      if (!isBackup(data)) {
        toast("导入失败：不是完整备份，没有覆盖本地数据");
        return;
      }
      const snapshot = {
        items: state.items.map((item) => ({ ...item })),
        gunFavorites: { ...gunFavTable },
        typeOverrides: { ...typeOverrideTable }
      };
      state.items = data.items.filter((row) => row && typeof row === "object").map((row) => {
        const known = dictionaryWeapon(row.name || "");
        const name = known ? known.name : (String(row.name || "").trim() || "未识别");
        const code = String(row.code || "").trim();
        return {
          id: row.id ? String(row.id) : uid(),
          name,
          type: keptType(row.type, name, code),
          code,
          price: normalizePrice(row.price || ""),
          note: String(row.note || "").trim(),
          favorite: row.favorite === true,
          createdAt: row.createdAt || Date.now()
        };
      });
      const favs = {};
      if (data.gunFavorites && typeof data.gunFavorites === "object" && !Array.isArray(data.gunFavorites)) {
        Object.entries(data.gunFavorites).forEach(([name, on]) => {
          if (name && on === true) favs[name] = true;
        });
      }
      const types = {};
      if (data.typeOverrides && typeof data.typeOverrides === "object" && !Array.isArray(data.typeOverrides)) {
        Object.entries(data.typeOverrides).forEach(([key, type]) => {
          if (key && TYPE_NAME[type] && type !== "all") types[key] = type;
        });
      }
      writeGunFavs(favs);
      writeTypeOverrides(types);
      const saved = save();
      markBackedUp();
      render();
      rememberSnapshot(snapshot, saved ? `已恢复 ${state.items.length} 套方案` : `已恢复 ${state.items.length} 套，但还没保存到本机`);
    }

    function shareRecord(item) {
      const type = item.type && TYPE_NAME[item.type] && item.type !== "all" ? item.type : "other";
      return {
        name: String(item.name || ""),
        type,
        code: String(item.code || ""),
        price: String(item.price || ""),
        note: String(item.note || ""),
        favorite: item.favorite === true
      };
    }

    function encodeShare(items) {
      const json = JSON.stringify(items.map(shareRecord));
      return SHARE_PREFIX + btoa(unescape(encodeURIComponent(json))).replace(/=+$/, "");
    }

    function decodeShare(text) {
      const raw = String(text || "").trim();
      if (!raw.startsWith(SHARE_PREFIX)) {
        toast("分享码无法解码，没有写入");
        return null;
      }
      try {
        let b64 = raw.slice(SHARE_PREFIX.length).replace(/-/g, "+").replace(/_/g, "/");
        b64 += "=".repeat((4 - (b64.length % 4)) % 4);
        const json = decodeURIComponent(escape(atob(b64)));
        const data = JSON.parse(json);
        if (!Array.isArray(data) || !data.length) throw new Error("empty");
        return data.map((row) => {
          if (!row || typeof row !== "object" || Array.isArray(row)) throw new Error("row");
          return shareRecord(row);
        });
      } catch {
        toast("分享码无法解码，没有写入");
        return null;
      }
    }

    function readableShare(item) {
      const bits = [item.name || "未识别"];
      const meta = [item.note, item.price].filter(Boolean).join(" · ");
      if (meta) bits.push(meta);
      if (item.code) bits.push(item.code);
      return bits.join("\n");
    }

    function backupPayload(items) {
      return {
        version: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        items: items || state.items,
        gunFavorites: gunFavTable,
        typeOverrides: typeOverrideTable
      };
    }

    function backupName() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `delta-gun-codes-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}.json`;
    }

    function downloadJson(data, name) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name || backupName();
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function markBackedUp() {
      try {
        localStorage.setItem(BACKUP_AT_KEY, String(Date.now()));
      } catch {}
      paintNotices();
    }

    function exportBackup() {
      downloadJson(backupPayload());
      markBackedUp();
      toast("已导出备份");
    }

    function paintNotices() {
      const bar = document.getElementById("backupBar");
      const unsaved = document.getElementById("unsavedBar");
      const stale = document.getElementById("staleBar");
      if (unsaved) unsaved.hidden = !state.unsaved;
      if (stale) stale.hidden = !state.staleTab;
      if (!bar) return;
      if (!state.items.length) {
        bar.hidden = true;
        return;
      }
      const at = Number(localStorage.getItem(BACKUP_AT_KEY) || 0);
      if (at && Date.now() - at <= FORTNIGHT) {
        bar.hidden = true;
        return;
      }
      const snooze = Number(localStorage.getItem(BACKUP_SNOOZE_KEY) || 0);
      bar.hidden = !!(snooze && Date.now() < snooze);
    }

    function askBackupChoice(data, done) {
      document.getElementById("confirmTitle").textContent = "发现一份备份";
      document.getElementById("confirmText").textContent = "合并只添加本地没有的方案，收藏和分类记忆只补充、不删除。恢复会用这份备份覆盖本机方案、枪组收藏和分类记忆，完成后可以撤回。";
      const alt = document.getElementById("confirmAlt");
      alt.hidden = false;
      alt.textContent = "合并";
      alt.className = "";
      const ok = document.getElementById("confirmOk");
      ok.textContent = "恢复";
      ok.className = "btn-danger";
      confirmAltAction = () => {
        mergePayload(data);
        if (done) done();
      };
      confirmAction = () => {
        restoreBackup(data);
        if (done) done();
      };
      document.getElementById("confirmOverlay").classList.add("show");
    }

    function importRows(text, mode) {
      const trimmed = String(text || "").trim();
      if (mode === "restore") {
        let data;
        try {
          data = JSON.parse(trimmed);
        } catch {
          toast("导入失败：不是合法的 JSON");
          return;
        }
        if (!isBackup(data)) {
          toast("导入失败：不是完整备份，没有覆盖本地数据");
          return;
        }
        askConfirm({
          title: "用备份恢复",
          text: "这会覆盖本机的方案、枪组收藏和分类记忆。完成后可以撤回。",
          okLabel: "恢复",
          onOk: () => restoreBackup(data)
        });
        return;
      }

      if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
        try {
          const data = JSON.parse(trimmed);
          if (!rowsFrom(data)) {
            toast("导入失败：文件内容需要是方案数组");
            return;
          }
          mergePayload(data);
          return;
        } catch {
          /* 不是合法 JSON，改走文本清单解析 */
        }
      }

      const rows = parseBulk(trimmed);
      if (!rows.length) {
        toast("没有解析到改枪码");
        return;
      }
      const result = addRows(rows);
      save();
      reportMerge(result, "已导入");
    }

    function ingestFromBox() {
      const box = document.getElementById("quickAdd");
      const text = box.value.trim();
      if (!text) return toast("先粘贴改枪码");
      const kind = classifyPaste(text);
      if (kind.kind === "bad-json") return toast("导入失败：不是合法的 JSON");
      if (kind.kind === "bad-shape") return toast("导入失败：不是方案数组");
      if (kind.kind === "backup") {
        askBackupChoice(kind.data, () => { box.value = ""; });
        return;
      }
      if (kind.kind === "share") {
        const rows = decodeShare(kind.text);
        if (!rows) return;
        const result = addRows(rows);
        save();
        reportMerge(result, "已并入分享码");
        box.value = "";
        return;
      }
      if (kind.kind === "rows") {
        mergePayload(kind.data);
        box.value = "";
        return;
      }
      if (ingestText(text)) box.value = "";
    }

      const favs = {};
      const types = {};

        if (typeOverrideTable[key]) types[key] = typeOverrideTable[key];

    async function shareEncoded(items, label) {
      if (!items.length) return toast("没有可分享的方案");
      let code = "";
      try {
        code = encodeShare(items);
      } catch {
        shareFile(items);
        toast("分享码生成失败，已改为下载 JSON");
        return;
      }
      if (code.length > SHARE_LIMIT) {
        shareFile(items);
        toast("内容较长，已改为下载 JSON，没有截断");

      }
      const ok = await copyText(code);

      toast(label || "已复制分享码");
    }

    function cardImage(item) {
      const canvas = document.createElement("canvas");
      canvas.width = 900;
      canvas.height = 420;
      const ctx = canvas.getContext("2d");
      if (!ctx) return Promise.reject(new Error("canvas"));
      ctx.fillStyle = "#121212";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#1e1e1e";
      ctx.fillRect(36, 36, 828, 348);
      ctx.fillStyle = "#ff9500";
      ctx.fillRect(36, 36, 828, 8);
      ctx.fillStyle = "#e8e8e8";
      ctx.font = "600 40px sans-serif";
      ctx.fillText(item.name || "未识别", 64, 120);
      ctx.fillStyle = "#888888";
      ctx.font = "28px sans-serif";
      ctx.fillText([item.note, item.price || "未标价"].filter(Boolean).join(" · "), 64, 180);
      ctx.fillStyle = "#b0b0b0";
      ctx.font = "24px sans-serif";
      const code = item.code || "";
      for (let i = 0; i < code.length; i += 36) ctx.fillText(code.slice(i, i + 36), 64, 250 + Math.floor(i / 36) * 36);
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("blob")), "image/png");
      });
    }

    async function shareOne(item) {
      const text = readableShare(item);
      try {
        const blob = await cardImage(item);
        const file = new File([blob], "gun-code.png", { type: "image/png" });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title: item.name || "改枪码", text, files: [file] });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      try {
        if (navigator.share) {
          await navigator.share({ title: item.name || "改枪码", text });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      const ok = await copyText(text);
      toast(ok ? "已复制分享文案" : "复制失败，请检查剪贴板权限");
    }

      input.focus();
      input.select();

    function closeNote(input) {
      const id = input.dataset.note;
      const item = state.items.find((x) => x.id === id);
      const card = input.closest(".card");
      const title = card && card.querySelector(".note-title");
      if (item) {
        item.note = input.value.trim();
        input.value = item.note;
        save();
      }
      if (title) {
        const note = item ? item.note : input.value.trim();
        title.textContent = note || "未命名方案";

        title.classList.remove("editing");

      input.classList.remove("editing");

      const pill = card.querySelector("[data-price-open]");
      const input = card.querySelector(".price-input");
      if (!pill || !input) return;
      pill.classList.add("editing");
      input.classList.add("editing");
      input.focus();
      input.select();
    }

    function closePrice(input) {
      const id = input.dataset.price;
      const item = state.items.find((x) => x.id === id);
      const card = input.closest(".card");
      const pill = card && card.querySelector("[data-price-open]");
      let changed = false;
      if (item) {
        const next = normalizePrice(input.value);
        changed = next !== (item.price || "");
        item.price = next;
        input.value = next;
        if (changed) save();
      }
      if (changed && item) {
        const siblings = state.items.filter((it) => it.type === item.type && it.name === item.name);
        if (siblings.length > 1) {
          refreshBoardQuiet();
          return;
        }
      }
      if (pill && item) {
        const view = displayPrice(item.price);
        pill.classList.toggle("empty", view.empty);
        pill.innerHTML = view.html;
        pill.classList.remove("editing");
      }
      input.classList.remove("editing");
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        return ok;
      }
    }
